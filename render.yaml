services:
  - type: web
    name: ligamagic-deck-tracker
    runtime: go
    plan: free
    region: virginia # crie o banco no Turso em aws-us-east-1 para ficar perto
    buildCommand: go build -o bin/server ./cmd/server
    startCommand: ./bin/server
    healthCheckPath: /healthz
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: MAIL_FROM
        value: "LigaMagic Deck Tracker <noreply@jrfsoftware.com.br>"
      - key: BASE_URL
        value: https://mtg.jrfsoftware.com.br
